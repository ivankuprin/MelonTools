name: Bug report
description: Report a reproducible problem with Melon Tools.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: 1.4.6
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest set of steps that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed account credentials, API keys, tokens, and personal data from this report.
          required: true
