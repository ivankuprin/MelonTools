name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app and UI syntax
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: MacOS/app
        run: xcodegen generate

      - name: Run macOS tests (unsigned)
        working-directory: MacOS
        run: |
          set -o pipefail
          xcodebuild \
            -project app/MelonTools.xcodeproj \
            -scheme MelonTools \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MelonToolsDerived" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Syntax-check the Windows UI JavaScript
        run: node --check Windows/app/ui/app.js

  windows:
    name: Windows app tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows/app/src-tauri
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: Windows/app/src-tauri -> target

      # The tests do not need the gateway engine: the checked-in compressed
      # engine is an embedded resource and is not exercised by cargo test.
      - name: Run cargo tests
        run: cargo test --locked

  docs-lint:
    name: Docs and manifest lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML, JSON, versions, and documentation links
        run: python .github/scripts/docs_lint.py
