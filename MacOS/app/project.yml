name: MelonTools
options:
  bundleIdPrefix: dev.melontools
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  MelonTools:
    type: application
    platform: macOS
    sources:
      - path: MelonTools
        excludes:
          - "Info.plist"
      - path: Resources
    info:
      path: MelonTools/Info.plist
      properties:
        CFBundleDisplayName: Melon Tools
        CFBundleName: Melon Tools
        CFBundleShortVersionString: "2.2.4"
        CFBundleVersion: "19"
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "© 2026 Melon Tools"
        NSHighResolutionCapable: true
        LSMinimumSystemVersion: "14.0"
        LSMultipleInstancesProhibited: true
        CFBundleLocalizations:
          - ru
          - en
        NSAppleEventsUsageDescription: "Melon Tools opens Terminal to launch isolated Codex CLI instances."
    postBuildScripts:
      - name: Embed gateway binary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          RES="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          GATEWAY_BIN="$SRCROOT/../build/cliproxyapi"
          if [ -f "$GATEWAY_BIN" ]; then
            mkdir -p "$RES/bin"
            cp "$GATEWAY_BIN" "$RES/bin/cliproxyapi"
            chmod +x "$RES/bin/cliproxyapi"
            echo "embedded gateway binary -> $RES/bin/cliproxyapi"
          else
            echo "warning: gateway binary missing at $GATEWAY_BIN (build it with build.sh)"
          fi
    scheme:
      testTargets:
        - MelonToolsTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.melontools.app
        MARKETING_VERSION: "2.2.3"
        CURRENT_PROJECT_VERSION: "20"
        GENERATE_INFOPLIST_FILE: "NO"

  MelonToolsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MelonToolsTests
    dependencies:
      - target: MelonTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.melontools.tests
        GENERATE_INFOPLIST_FILE: "YES"
