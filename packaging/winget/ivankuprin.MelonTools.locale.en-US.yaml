ShortDescription: Codex account pool, local OpenAI-compatible gateway, and scheduled model tasks.
Description: >-
  Melon Tools is a desktop companion for Codex accounts and model providers.
  It keeps ChatGPT accounts in a local vault, runs a loopback OpenAI-compatible
  gateway, connects Claude, Google Antigravity, OpenRouter, and OpenCode, and
  shows account and quota chips inside the Codex composer. The Windows build
  also includes the task scheduler.
