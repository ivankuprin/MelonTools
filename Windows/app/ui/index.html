<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melon Tools</title>
  <link rel="stylesheet" href="mt.css" />
</head>
<body>
  <aside>
    <div class="brand">
      <div class="logo">🍉</div>
      <div>
        <div class="title">Melon Tools</div>
        <div class="sub">codex + api</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-update">
      <button class="update-btn" id="update-btn" onclick="A.updateOpen()">
        <span id="update-label">Проверить обновление</span>
      </button>
    </div>
    <div class="side-footer">
      <span class="dot" id="gw-dot"></span>
      <span id="gw-label">…</span>
      <span class="spacer"></span>
      <span id="ver"></span>
    </div>
  </aside>
  <main><div class="board" id="main"></div></main>
  <div id="update-modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="update-title">Проверка обновлений…</h2>
      <div id="update-sub" class="footnote"></div>
      <div id="update-notes" class="notes" style="display:none"></div>
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="ghost" id="update-cancel" onclick="A.updateClose()">Отмена</button>
        <button class="btn" id="update-apply" style="display:none" onclick="A.updateApply()">Обновить</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
